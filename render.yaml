databases:
  - name: ielts-guru-db
    plan: free
    databaseName: ielts_guru
    user: ielts_guru_user

services:
  - type: web
    name: ielts-guru
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ielts-guru-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: FLW_SECRET_KEY
        sync: false